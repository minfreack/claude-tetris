<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div id="pause-box" class="pause-box" tabindex="-1">
        <div id="pause-main" class="pause-view">
          <p class="pause-title">PAUSA</p>
          <button id="pause-resume-btn" class="pause-btn pause-btn-primary">Reanudar</button>
          <button id="pause-restart-btn" class="pause-btn">Reiniciar</button>
          <button id="pause-controls-btn" class="pause-btn">Ver controles</button>
          <label class="pause-field" for="pause-level">
            <span class="pause-field-label">Nivel inicial</span>
            <select id="pause-level" class="pause-select"></select>
          </label>
          <p class="pause-hint">Se aplica en la próxima partida</p>
        </div>
        <div id="pause-controls" class="pause-view hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="pause-keys">
            <li><span><kbd>←</kbd> <kbd>→</kbd></span><span>mover</span></li>
            <li><span><kbd>↑</kbd> <kbd>X</kbd></span><span>rotar</span></li>
            <li><span><kbd>↓</kbd></span><span>bajar</span></li>
            <li><span><kbd>Space</kbd></span><span>caída</span></li>
            <li><span><kbd>P</kbd> <kbd>Esc</kbd></span><span>pausa</span></li>
          </ul>
          <button id="pause-back-btn" class="pause-btn">Volver</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="pause.js"></script>
  <script src="game.js"></script>
</body>
</html>
